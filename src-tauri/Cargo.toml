[package]
name = "aitool"
version = "1.0.4"
description = "AITool - A desktop application built with Tauri"
authors = ["v0tx"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aitool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
incremental = false
lto = true
opt-level = "s"
strip = true
